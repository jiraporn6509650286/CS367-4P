<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #cccccc;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>รายการห้องในห้องสมุด</h1>
    <table id="roomTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>ชื่อห้อง</th>
                <th>ขนาด</th>
                <th>ความจุ</th>
                <th>สถานะ</th>
                <th>สิ่งอำนวยความสะดวก</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        let bookedRoomIds = [];
    
        // ดึงรายการห้องที่ถูกจองวันนี้
        fetch("/bookings/today")
            .then(response => response.json())
            .then(data => {
                bookedRoomIds = data;
                loadRooms(); // โหลดห้องหลังได้ข้อมูลจอง
            });
    
        function loadRooms() {
            fetch("/rooms")
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.querySelector("#roomTable tbody");
                    tableBody.innerHTML = ""; // clear ก่อน
    
                    data.forEach(room => {
                        const isBooked = bookedRoomIds.includes(room.id);
                        const statusDisplay = isBooked ? "❌ จองแล้ว" : "✅ ว่าง";
    
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${room.id}</td>
                            <td>${room.name}</td>
                            <td>${room.size}</td>
                            <td>${room.capacity}</td>
                            <td>${statusDisplay}</td>
                            <td>${room.amenities.join(", ")}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                });
        }
    </script>
    
</body>
</html>
