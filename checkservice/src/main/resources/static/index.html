<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>รายการห้องทั้งหมด</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 2rem;
      background-color: #f8f8f8;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }

    .room-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 900px;
      margin: auto;
    }

    .room-card {
      background: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room-name {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .room-meta {
      font-size: 0.9rem;
      color: #666;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .tag {
      background: #eeeeee;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .btn-detail {
      align-self: flex-end;
      margin-top: 1rem;
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-detail:hover {
      background-color: #0c5dc0;
    }
  </style>
</head>
<body>
  <h1>รายการห้องในห้องสมุด</h1>
  <div class="room-list" id="roomList">
    <!-- cards จะถูกเพิ่มตรงนี้ด้วย JS -->
  </div>

  <script>
    fetch("http://localhost:8080/rooms")
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById("roomList");
        data.forEach(room => {
          const card = document.createElement("div");
          card.className = "room-card";
          card.innerHTML = `
            <div class="room-header">
              <div class="room-name">${room.name}</div>
              
            </div>
          
            
            <button class="btn-detail" onclick="goToDetail(${room.id})">ดูรายละเอียด</button>
          `;
          list.appendChild(card);
        });
      });

    function goToDetail(id) {
      window.location.href = `/room-detail.html?id=${id}`;
    }
  </script>
</body>
</html>
